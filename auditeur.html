<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orateur Pro - Auditeur Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fb: '#1877f2',
                        obsidian: '#0a0a0b'
                    }
                }
            }
        }
    </script>
    <style>
        /* Resolving CSS conflicts and @apply errors */
        * { transition: all 0.25s ease; }

        /* Apply 13px to text-bearing elements without breaking icons */
        html, body, select, input, button, p, div, span, h1 {
            font-family: 'Inter', sans-serif;
            font-size: 13px !important;
        }

        /* Restore icon sizes */
        .fas, .fab, .far {
            font-family: "Font Awesome 6 Free" !important;
            font-size: inherit !important;
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #f0f2f5;
        }
        .dark body { background-color: #050505; }

        .app-container {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .dark .app-container { background-color: #0a0a0b; }

        /* Professional Header - Glassmorphism */
        .header-app {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e4e6eb;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dark .header-app {
            background: rgba(28, 30, 33, 0.85);
            border-bottom: 1px solid #3e4042;
        }

        /* Drawer Menu */
        .side-menu {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            height: 100%;
            background: #ffffff;
            z-index: 100;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .dark .side-menu { background: #1c1e21; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .side-menu.open { left: 0; }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 90;
            display: none;
        }
        .overlay.show { display: block; }

        /* Viewport Area */
        .stream-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
            scroll-behavior: smooth;
        }
        .dark .stream-viewport { background: #050505; }
        .stream-viewport::-webkit-scrollbar { display: none; }
        .stream-viewport { -ms-overflow-style: none; scrollbar-width: none; }

        .phrase-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 1px solid #e4e6eb;
        }
        .dark .phrase-card { background: #242526; border: 1px solid #3e4042; }

        .text-main {
            font-size: 13px !important;
            font-weight: 500;
            color: #1c1e21;
            line-height: 1.5;
        }
        .dark .text-main { color: #e4e6eb; }

        .text-orig {
            font-size: 10px !important;
            font-weight: 700;
            color: #65676b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            display: none;
        }
        .dark .text-orig { color: #b0b3b8; }
        .text-orig.show { display: block; }

        .live-tag {
            background: rgba(250, 62, 62, 0.1);
            color: #fa3e3e;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 9px !important;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pulse-dot {
            width: 5px; height: 5px; background: #fa3e3e; border-radius: 50%;
            animation: pulse-kf 1s infinite;
        }
        @keyframes pulse-kf { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

        .btn-circle {
            width: 36px; height: 36px; border-radius: 50%;
            background: #f0f2f5;
            display: flex; align-items: center; justify-content: center;
            color: #1c1e21;
        }
        .dark .btn-circle { background: #3a3b3c; color: #e4e6eb; }

        select, input[type="range"] {
            width: 100%;
            background: #f0f2f5;
            border: 1px solid #dddfe2;
            border-radius: 10px;
            padding: 8px 12px;
            outline: none;
        }
        .dark select, .dark input[type="range"] { background: #3a3b3c; border: 1px solid #3e4042; color: white; }
    </style>
</head>
<body class="light">
    <div class="app-container">

        <!-- Drawer -->
        <div id="overlay" class="overlay"></div>
        <aside id="sideMenu" class="side-menu">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-bold text-lg">Configuration</h2>
                <button id="closeMenu" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-2 block">Langue de l'auditeur</label>
                    <select id="langSelect">
                        <option value="en-US">English (United States)</option>
                        <option value="fr-FR">Français (France)</option>
                        <option value="es-ES">Español (España)</option>
                        <option value="de-DE">Deutsch (Deutschland)</option>
                        <option value="it-IT">Italiano (Italia)</option>
                        <option value="pt-PT">Português (Portugal)</option>
                        <option value="zh-CN">中文 (中国)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-2 block">Vitesse Vocale</label>
                    <div class="flex items-center gap-3">
                        <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="1">
                        <span id="rateLabel" class="font-bold text-fb min-w-[30px]">1.0x</span>
                    </div>
                </div>

                <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-white/5 rounded-2xl border border-gray-100 dark:border-white/5">
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-700 dark:text-gray-300">Mode Miniature</span>
                        <span class="text-[10px] text-gray-400">Voir la source orateur</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleOriginal" class="sr-only peer">
                        <div class="w-10 h-5 bg-gray-200 dark:bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-fb"></div>
                    </label>
                </div>

                <div class="pt-6 border-t border-gray-100 dark:border-white/5 space-y-4">
                    <button id="testAudioBtn" class="w-full bg-fb text-white py-3.5 rounded-xl font-bold shadow-lg shadow-fb/20 active:scale-95 transition-transform">
                        <i class="fas fa-play-circle mr-2"></i> Tester la synthèse
                    </button>

                    <button id="themeToggle" class="w-full flex items-center justify-between p-4 bg-gray-50 dark:bg-white/5 rounded-xl font-semibold">
                        <span>Changer le thème</span>
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-4 pt-4 border-t border-gray-100 dark:border-white/5">
                <div class="flex items-center justify-between p-4 bg-fb/5 rounded-xl border border-fb/10">
                    <div class="flex flex-col">
                        <span class="font-bold text-fb">Voix Orateur</span>
                        <span class="text-[9px] text-fb/60">Audio direct de l'orateur</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleLiveVoice" class="sr-only peer" checked>
                        <div class="w-10 h-5 bg-gray-200 dark:bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-fb"></div>
                    </label>
                </div>

                <div class="px-2">
                    <label class="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Volume Direct</label>
                    <input type="range" id="liveVolume" min="0" max="1" step="0.1" value="0.8" class="w-full">
                </div>
            </div>

            <div class="mt-auto text-[9px] text-gray-400 text-center uppercase tracking-widest font-bold">
                Orateur Pro v5.0 // Stable Engine
            </div>
        </aside>

        <!-- Header -->
        <header class="header-app">
            <button id="openMenu" class="btn-circle">
                <i class="fas fa-bars"></i>
            </button>

            <div class="flex flex-col items-center">
                <span class="font-bold text-[12px] tracking-tight text-slate-900 dark:text-white uppercase font-black">Orateur Pro</span>
                <div class="live-tag">
                    <div class="pulse-dot"></div> EN DIRECT
                </div>
            </div>

            <div class="btn-circle border-2 border-fb/20">
                <i class="fas fa-volume-up text-fb text-xs"></i>
            </div>
        </header>

        <!-- Content -->
        <main class="stream-viewport" id="scrollBox">
            <div id="empty-state" class="my-auto text-center space-y-4 opacity-30">
                <i class="fas fa-tower-broadcast text-5xl text-fb"></i>
                <p class="font-bold tracking-tight">Signal audio en attente...</p>
            </div>

            <div id="stream-content" class="hidden w-full"></div>
            <div id="interim-block" class="phrase-card opacity-50 hidden italic border-dashed border-fb/30"></div>
        </main>
    </div>

    <script>
        const UI = {
            menu: document.getElementById('sideMenu'),
            overlay: document.getElementById('overlay'),
            open: document.getElementById('openMenu'),
            close: document.getElementById('closeMenu'),
            scroll: document.getElementById('scrollBox'),
            content: document.getElementById('stream-content'),
            interim: document.getElementById('interim-block'),
            empty: document.getElementById('empty-state'),
            lang: document.getElementById('langSelect'),
            rate: document.getElementById('rateRange'),
            rateLabel: document.getElementById('rateLabel'),
            toggle: document.getElementById('toggleOriginal'),
            theme: document.getElementById('themeToggle'),
            test: document.getElementById('testAudioBtn'),
            liveVoice: document.getElementById('toggleLiveVoice'),
            liveVolume: document.getElementById('liveVolume')
        };

        let lastTS = 0;
        const synth = window.speechSynthesis;

        const rtcState = {
            pc: null,
            stream: null,
            audio: new Audio(),
            pollInterval: null,
            candidatesAdded: new Set()
        };

        function logVoice(msg) {
            console.log(msg);
            fetch('log_voice.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'log=' + encodeURIComponent(msg)
            });
        }

        // Drawer Controls
        UI.open.onclick = () => { UI.menu.classList.add('open'); UI.overlay.classList.add('show'); };
        UI.close.onclick = UI.overlay.onclick = () => { UI.menu.classList.remove('open'); UI.overlay.classList.remove('show'); };
        UI.theme.onclick = () => document.documentElement.classList.toggle('dark');

        // Robust Voice Selection
        function getBestVoice(langCode) {
            const voices = synth.getVoices();
            if (!voices.length) return null;

            const short = langCode.split('-')[0].toLowerCase();

            // 1. Precise match + Quality
            let voice = voices.find(v => v.lang === langCode && (v.name.includes('Google') || v.name.includes('Premium') || v.name.includes('Natural')));
            // 2. Precise match
            if (!voice) voice = voices.find(v => v.lang === langCode);
            // 3. Lang match + Quality
            if (!voice) voice = voices.find(v => v.lang.startsWith(short) && (v.name.includes('Google') || v.name.includes('Premium')));
            // 4. Lang match
            if (!voice) voice = voices.find(v => v.lang.startsWith(short));
            // 5. Fallback
            if (!voice) voice = voices.find(v => v.default) || voices[0];

            return voice;
        }

        function speak(text) {
            if (!text?.trim()) return;

            // Ensure any previous speech is cut for real-time feel
            synth.cancel();

            // Small async delay to ensure engine reset
            setTimeout(() => {
                try {
                    const target = UI.lang.value;
                    const voice = getBestVoice(target);

                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = target;
                    if (voice) utterance.voice = voice;
                    utterance.rate = parseFloat(UI.rate.value);
                    utterance.volume = 1;

                    utterance.onstart = () => logVoice(`TTS Active | Lang: ${target} | Voice: ${voice?.name || 'Default'}`);
                    utterance.onerror = (e) => logVoice(`TTS Fail: ${e.error} | Lang: ${target} | Voice: ${voice?.name || 'None'}`);

                    synth.speak(utterance);
                } catch (err) {
                    logVoice("TTS Exception: " + err.message);
                }
            }, 50);
        }

        // Force Unlock Audio (on load and on interaction)
        function forceUnlock() {
            const unlock = new SpeechSynthesisUtterance("");
            synth.speak(unlock);

            // Audio context unlock
            rtcState.audio.play().catch(() => {});

            logVoice("Speech engine unlocked");
            initWebRTCReceiver();
        }
        window.addEventListener('click', forceUnlock, { once: true });

        async function initWebRTCReceiver() {
            if (rtcState.pc) rtcState.pc.close();

            rtcState.pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            rtcState.pc.ontrack = (event) => {
                logVoice("WebRTC Track received");
                rtcState.audio.srcObject = event.streams[0];
                rtcState.audio.play();
            };

            rtcState.pc.onicecandidate = ({candidate}) => {
                if (candidate) {
                    fetch('signaling.php?action=push&role=auditor', {
                        method: 'POST',
                        body: JSON.stringify({ candidate })
                    });
                }
            };

            // Signaling poll
            if (rtcState.pollInterval) clearInterval(rtcState.pollInterval);
            rtcState.pollInterval = setInterval(async () => {
                try {
                    const res = await fetch('signaling.php');
                    const data = await res.json();

                    if (data.offer && rtcState.pc.signalingState === 'stable') {
                        await rtcState.pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await rtcState.pc.createAnswer();
                        await rtcState.pc.setLocalDescription(answer);
                        fetch('signaling.php?action=push&role=auditor', {
                            method: 'POST',
                            body: JSON.stringify({ answer })
                        });
                    }

                    if (data.orator_candidates && rtcState.pc.remoteDescription) {
                        data.orator_candidates.forEach(candidate => {
                            const candStr = JSON.stringify(candidate);
                            if (candidate && !rtcState.candidatesAdded.has(candStr)) {
                                rtcState.pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
                                rtcState.candidatesAdded.add(candStr);
                            }
                        });
                    }
                } catch (e) {}
            }, 3000);
        }

        UI.liveVolume.oninput = () => {
            rtcState.audio.volume = parseFloat(UI.liveVolume.value);
        };

        UI.liveVoice.onchange = () => {
            rtcState.audio.muted = !UI.liveVoice.checked;
        };

        UI.test.onclick = () => {
            logVoice("User test triggered");
            speak("Ceci est un test de la synthèse vocale Orateur Pro.");
        };

        async function fastTranslate(text) {
            const target = UI.lang.value.split('-')[0];
            if (target === 'fr') return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) { return text; }
        }

        async function refresh() {
            try {
                const res = await fetch('broadcast.json?t=' + Date.now());
                const data = await res.json();

                if (data.timestamp > lastTS) {
                    lastTS = data.timestamp;
                    UI.empty.classList.add('hidden');
                    UI.content.classList.remove('hidden');

                    if (data.type === 'interim') {
                        UI.interim.classList.remove('hidden');
                        UI.interim.innerText = await fastTranslate(data.text);
                    } else {
                        UI.interim.classList.add('hidden');
                        const translated = await fastTranslate(data.text);

                        const card = document.createElement('div');
                        card.className = 'phrase-card';
                        const showOrig = UI.toggle.checked ? 'show' : '';
                        card.innerHTML = `
                            <div class="text-orig ${showOrig}">${data.text}</div>
                            <div class="text-main">${translated}</div>
                        `;
                        UI.content.appendChild(card);
                        speak(translated);
                    }
                    UI.scroll.scrollTop = UI.scroll.scrollHeight;
                }
            } catch (e) {}
        }

        setInterval(refresh, 300);
        UI.rate.oninput = () => UI.rateLabel.innerText = UI.rate.value + 'x';

        // Listen for voice loading
        window.speechSynthesis.onvoiceschanged = () => {
            logVoice(`Voices ready: ${synth.getVoices().length}`);
        };
        logVoice("Auditor loaded. Engine status: " + (!!window.speechSynthesis));
    </script>
</body>
</html>
