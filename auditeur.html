<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orateur Pro - Auditeur Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0b',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-size: 13px !important; transition: background-color 0.3s, color 0.3s; }
        html, body, select, input, button, p, div, span, h1 { font-family: 'Inter', sans-serif; }

        body {
            margin: 0; padding: 0; overflow: hidden;
            @apply bg-slate-50 dark:bg-obsidian;
        }

        .app-container {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            @apply bg-white dark:bg-obsidian shadow-2xl;
        }

        .header-app {
            padding: 12px 20px;
            @apply border-b border-slate-100 dark:border-white/5;
            z-index: 30;
        }

        /* Fixed-size Container with auto-scroll and invisible scrollbar */
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .scroll-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .translation-block {
            font-size: 20px !important;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 8px; /* Reduced spacing */
            @apply text-slate-900 dark:text-white;
        }

        .original-mini {
            font-size: 10px !important;
            font-weight: 600;
            @apply text-slate-400 dark:text-white/30 uppercase tracking-tighter mb-4;
            display: none;
        }
        .original-mini.show { display: block; }

        .footer-controls {
            padding: 20px;
            @apply border-t border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5;
            border-radius: 24px 24px 0 0;
        }

        .live-indicator {
            @apply flex items-center gap-2 bg-red-50 dark:bg-red-950/30 px-2 py-1 rounded text-red-600 dark:text-red-400 font-black text-[9px] uppercase;
        }

        .pulse-dot {
            width: 5px; height: 5px; @apply bg-red-600 dark:bg-red-400 rounded-full;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        select, input[type="range"] {
            @apply bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 outline-none text-slate-900 dark:text-white;
        }

        .theme-btn {
            @apply w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 dark:text-white/40 hover:bg-slate-100 dark:hover:bg-white/10 transition-all;
        }
    </style>
</head>
<body class="dark"> <!-- Defaulting to dark as requested "noir ou black" -->
    <div class="app-container">
        <!-- Header -->
        <header class="header-app flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-tower-broadcast text-xs"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 dark:text-white text-[13px]">Orateur Pro</h1>
                    <div class="live-indicator">
                        <div class="pulse-dot"></div> EN DIRECT
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="themeToggle" class="theme-btn" title="Changer le thème">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
                <button id="speakerBtn" class="theme-btn" title="Activer la lecture vocale">
                    <i class="fas fa-volume-mute text-red-500" id="speakerIcon"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Stream Area -->
        <main class="scroll-container" id="scrollBox">
            <div id="empty-state" class="my-auto text-center space-y-4">
                <i class="fas fa-microphone-lines text-4xl text-slate-200 dark:text-white/5"></i>
                <p class="text-slate-400 dark:text-white/20 font-medium">En attente de l'orateur...</p>
            </div>

            <div id="stream-content" class="hidden w-full">
                <!-- Phrases will be appended here -->
            </div>
            <div id="interim-block" class="translation-block opacity-40 italic hidden"></div>
            <div id="anchor"></div> <!-- Invisible anchor for auto-scroll -->
        </main>

        <!-- Controls -->
        <footer class="footer-controls space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-[9px] font-bold text-slate-400 dark:text-white/30 uppercase">Langue</label>
                    <select id="langSelect">
                        <option value="none">Français (Origine)</option>
                        <option value="en">English (US)</option>
                        <option value="es">Español</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[9px] font-bold text-slate-400 dark:text-white/30 uppercase">Vitesse Audio</label>
                    <div class="flex items-center gap-2">
                        <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="1" class="flex-1">
                        <span id="rateLabel" class="text-[10px] font-bold text-indigo-500 w-5">1x</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between p-3 bg-white dark:bg-white/5 rounded-2xl border border-slate-100 dark:border-white/5">
                <span class="font-bold text-slate-600 dark:text-white/60">Afficher l'original</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggleOriginal" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-200 dark:bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>
        </footer>
    </div>

    <script>
        const UI = {
            scroll: document.getElementById('scrollBox'),
            content: document.getElementById('stream-content'),
            interim: document.getElementById('interim-block'),
            empty: document.getElementById('empty-state'),
            lang: document.getElementById('langSelect'),
            rate: document.getElementById('rateRange'),
            rateLabel: document.getElementById('rateLabel'),
            toggle: document.getElementById('toggleOriginal'),
            speaker: document.getElementById('speakerBtn'),
            speakerIcon: document.getElementById('speakerIcon'),
            themeToggle: document.getElementById('themeToggle')
        };

        let lastTS = 0;
        let ttsActive = false;
        const synth = window.speechSynthesis;

        // Theme Toggle
        UI.themeToggle.onclick = () => {
            document.body.classList.toggle('dark');
        };

        // TTS Professional Quality Setup
        function getBestVoice(lang) {
            const voices = synth.getVoices();
            // Try to find "premium" or higher quality voices
            return voices.find(v => v.lang.startsWith(lang) && (v.name.includes('Google') || v.name.includes('Premium') || v.name.includes('Natural')))
                   || voices.find(v => v.lang.startsWith(lang));
        }

        function speak(text) {
            if (!ttsActive || !text) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const targetLang = UI.lang.value === 'none' ? 'fr' : UI.lang.value;
            utterance.lang = targetLang;
            utterance.voice = getBestVoice(targetLang);
            utterance.rate = parseFloat(UI.rate.value);
            utterance.pitch = 1.0;
            synth.speak(utterance);
        }

        UI.speaker.onclick = () => {
            ttsActive = !ttsActive;
            UI.speakerIcon.className = ttsActive ? "fas fa-volume-up text-indigo-500" : "fas fa-volume-mute text-red-500";
            if (ttsActive) {
                // Force unlock mobile audio context
                const dummy = new SpeechSynthesisUtterance("Vocal activé");
                dummy.volume = 0;
                synth.speak(dummy);
            }
        };

        async function fastTranslate(text) {
            const target = UI.lang.value;
            if (target === 'none' || !text) return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) { return text; }
        }

        async function refresh() {
            try {
                const res = await fetch('broadcast.json?t=' + Date.now());
                const data = await res.json();

                if (data.timestamp > lastTS) {
                    lastTS = data.timestamp;
                    UI.empty.classList.add('hidden');
                    UI.content.classList.remove('hidden');

                    if (data.type === 'interim') {
                        UI.interim.classList.remove('hidden');
                        UI.interim.innerText = await fastTranslate(data.text);
                    } else {
                        UI.interim.classList.add('hidden');
                        const translated = await fastTranslate(data.text);

                        // Append new block
                        const block = document.createElement('div');
                        const showOrig = UI.toggle.checked ? 'show' : '';
                        block.innerHTML = `
                            <div class="original-mini ${showOrig}">${data.text}</div>
                            <div class="translation-block">${translated}</div>
                        `;
                        UI.content.appendChild(block);

                        speak(translated);
                    }

                    // Auto-scroll to bottom
                    UI.scroll.scrollTop = UI.scroll.scrollHeight;
                }
            } catch (e) {}
        }

        setInterval(refresh, 300);
        UI.rate.oninput = () => UI.rateLabel.innerText = UI.rate.value + 'x';

        // Handle voice loading
        synth.onvoiceschanged = () => { console.log("Voices loaded"); };
    </script>
</body>
</html>
