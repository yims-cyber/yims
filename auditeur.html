<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orateur Pro - Stream Auditeur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-size: 13px !important; font-family: 'Inter', sans-serif !important; }
        body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; overflow: hidden; }

        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.03);
            position: relative;
        }

        .header-app {
            background: white;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            z-index: 20;
        }

        .stream-area {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.02), transparent);
        }

        .translation-main {
            font-size: 24px !important;
            font-weight: 700;
            line-height: 1.4;
            color: #0f172a;
            transition: all 0.2s ease;
        }

        .original-miniature {
            font-size: 11px !important;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: none;
            padding: 4px 8px;
            background: #f1f5f9;
            border-radius: 6px;
            width: fit-content;
        }

        .original-miniature.show {
            display: block;
        }

        .bottom-controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #f1f5f9;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.02);
        }

        .live-tag {
            background: #fee2e2;
            color: #ef4444;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px !important;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-action {
            background: #f1f5f9;
            border: none;
            padding: 10px;
            border-radius: 12px;
            color: #64748b;
            transition: all 0.2s;
        }

        .btn-action:active { transform: scale(0.95); }
        .btn-action.active { background: #6366f1; color: white; }

        #interim-indicator {
            height: 4px;
            background: #6366f1;
            width: 0%;
            transition: width 0.3s;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Progress for stream -->
        <div id="interim-indicator"></div>

        <header class="header-app flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                    <i class="fas fa-tower-broadcast"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-[14px]">Orateur <span class="text-indigo-600">Pro</span></h1>
                    <div class="live-tag">
                        <div class="pulse-dot"></div>
                        STREAM LIVE
                    </div>
                </div>
            </div>
            <button id="speakerBtn" class="btn-action">
                <i class="fas fa-volume-up"></i>
            </button>
        </header>

        <main class="stream-area text-center">
            <div id="empty-state" class="space-y-4">
                <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto text-slate-200">
                    <i class="fas fa-waveform text-2xl"></i>
                </div>
                <p class="text-slate-400 font-medium italic">En attente de la voix de l'orateur...</p>
            </div>

            <div id="stream-content" class="hidden">
                <div id="translated-text" class="translation-main">
                    <!-- Live Translation -->
                </div>
                <div id="original-text" class="original-miniature mx-auto">
                    <!-- Original Mini -->
                </div>
            </div>
        </main>

        <footer class="bottom-controls space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Langue d'écoute</label>
                    <select id="langSelect" class="w-full bg-slate-50 border-none rounded-xl px-3 py-2.5 font-semibold focus:ring-2 focus:ring-indigo-100 outline-none">
                        <option value="none">Français (Original)</option>
                        <option value="en">English (US)</option>
                        <option value="es">Español</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Vitesse de lecture</label>
                    <div class="flex items-center gap-3 h-10">
                        <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" class="flex-1 accent-indigo-600">
                        <span id="rateLabel" class="text-[10px] font-bold text-indigo-600 min-w-[20px]">1x</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-slate-400 shadow-sm">
                        <i class="fas fa-language"></i>
                    </div>
                    <span class="font-bold text-slate-600">Afficher l'original</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggleOriginal" class="sr-only peer">
                    <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>
        </footer>
    </div>

    <script>
        const UI = {
            empty: document.getElementById('empty-state'),
            content: document.getElementById('stream-content'),
            translated: document.getElementById('translated-text'),
            original: document.getElementById('original-text'),
            lang: document.getElementById('langSelect'),
            rate: document.getElementById('rateRange'),
            rateLabel: document.getElementById('rateLabel'),
            toggle: document.getElementById('toggleOriginal'),
            speaker: document.getElementById('speakerBtn'),
            indicator: document.getElementById('interim-indicator')
        };

        let lastTS = 0;
        let lastText = "";
        const synth = window.speechSynthesis;
        let ttsEnabled = false;

        async function fastTranslate(text, target) {
            if (target === 'none' || !text) return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) { return text; }
        }

        function speak(text, target) {
            if (!ttsEnabled || !text) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = target === 'none' ? 'fr-FR' : target;
            utterance.rate = parseFloat(UI.rate.value);
            synth.speak(utterance);
        }

        async function updateStream() {
            try {
                const res = await fetch('broadcast.json?nocache=' + Date.now());
                if (!res.ok) return;
                const data = await res.json();

                if (data.timestamp > lastTS) {
                    lastTS = data.timestamp;
                    UI.empty.classList.add('hidden');
                    UI.content.classList.remove('hidden');

                    const target = UI.lang.value;

                    // Show original miniature logic
                    UI.original.innerText = data.text;
                    UI.original.classList.toggle('show', UI.toggle.checked);

                    if (data.type === 'interim') {
                        UI.indicator.style.width = '100%';
                        // Fast translate interim if not too long or if it changed significantly
                        if (data.text !== lastText) {
                            const translated = await fastTranslate(data.text, target);
                            UI.translated.innerHTML = `<span class="opacity-50 italic">${translated}...</span>`;
                            lastText = data.text;
                        }
                    } else {
                        UI.indicator.style.width = '0%';
                        const translated = await fastTranslate(data.text, target);
                        UI.translated.innerHTML = `<span>${translated}</span>`;
                        speak(translated, target);
                        lastText = "";
                    }
                }
            } catch (e) {}
        }

        // Fast Polling: 250ms for "TikTok Live" feel
        setInterval(updateStream, 250);

        // Control Listeners
        UI.rate.oninput = () => UI.rateLabel.innerText = UI.rate.value + 'x';
        UI.speaker.onclick = () => {
            ttsEnabled = !ttsEnabled;
            UI.speaker.classList.toggle('active', ttsEnabled);
            if (ttsEnabled) {
                // Unlock audio on mobile
                const dummy = new SpeechSynthesisUtterance("");
                synth.speak(dummy);
            }
        };
        UI.toggle.onchange = () => {
            UI.original.classList.toggle('show', UI.toggle.checked);
        };
        UI.lang.onchange = () => {
            lastText = ""; // Force re-translation on language change
            lastTS = 0;
        };
    </script>
</body>
</html>
