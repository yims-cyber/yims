<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orateur Pro - Auditeur Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { fb: '#1877f2', obsidian: '#0a0a0b' },
                    animation: {
                        'slide-in': 'slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
                        'fade-in': 'fadeIn 0.4s ease-out'
                    },
                    keyframes: {
                        slideIn: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(0)' } },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }
                    }
                }
            }
        }
    </script>
    <style>
        * { transition: background-color 0.3s, color 0.3s; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: 'Inter', sans-serif;
            height: 100%; width: 100%; margin: 0; padding: 0;
            overflow: hidden; position: fixed;
        }

        body { background-color: #f0f2f5; font-size: 13px; }
        .dark body { background-color: #050505; }

        .app-container {
            max-width: 450px; margin: 0 auto; height: 100%;
            display: flex; flex-direction: column;
            background-color: #ffffff; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }
        .dark .app-container { background-color: #0a0a0b; }

        .header-app {
            padding: 14px 20px; z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e4e6eb;
        }
        .dark .header-app { background: rgba(10, 10, 11, 0.9); border-bottom: 1px solid #242526; }

        /* Offline / Waiting View */
        #offline-screen {
            position: fixed; inset: 0; z-index: 60;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; text-align: center; background: #ffffff;
        }
        .dark #offline-screen { background: #0a0a0b; }

        .preacher-img {
            width: 200px; height: 200px; border-radius: 30px;
            object-fit: cover; margin-bottom: 0px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 4px solid #f0f2f5;
        }
        .dark .preacher-img { border-color: #242526; }

        /* Audio Spectrum Animation */
        .spectrum { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-bottom: 20px; }
        .bar { width: 3px; background: #1877f2; border-radius: 3px; animation: bounce 1s infinite ease-in-out; }
        @keyframes bounce {
            0%, 100% { height: 5px; }
            50% { height: 25px; }
        }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        /* Stream Content */
        .stream-viewport {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column;
            background: #f0f2f5; scroll-behavior: smooth;
        }
        .dark .stream-viewport { background: #050505; }
        .stream-viewport::-webkit-scrollbar { display: none; }

        .phrase-card {
            background: #ffffff; border-radius: 16px; padding: 12px 16px;
            margin-bottom: 12px; border: 1px solid #e4e6eb;
            animation: fadeIn 0.3s ease-out;
        }
        .dark .phrase-card { background: #242526; border: 1px solid #3e4042; }

        .side-menu {
            position: absolute; top: 0; left: -100%; width: 85%; height: 100%;
            background: #ffffff; z-index: 100; padding: 24px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .dark .side-menu { background: #1c1e21; }
        .side-menu.open { left: 0; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 90; opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        .speaking-indicator {
            font-size: 10px !important; color: #1877f2; font-weight: 700;
            display: flex; align-items: center; gap: 5px; margin-top: 2px;
        }

        .text-orig {
            font-size: 10px !important; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
            display: none;
        }
        .text-orig.show { display: block; }
    </style>
</head>
<body class="light">
    <div class="app-container">

        <!-- Offline View -->
        <div id="offline-screen" class="animate-fade-in">
            <div class="relative mb-8">
                <img src="https://images.unsplash.com/photo-1516280440614-37939bbdd4f1?q=80&w=500&auto=format&fit=crop" class="preacher-img" alt="Prédicateur">
                <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-fb text-white px-4 py-1 rounded-full text-[10px] font-bold tracking-widest shadow-xl">STUDIO</div>
            </div>
            <div class="spectrum">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <h2 class="text-2xl font-black text-slate-800 dark:text-white mb-2 tracking-tight">Attente du direct</h2>
            <p class="text-slate-400 font-medium leading-relaxed">L'orateur prépare la session.<br>La transcription commencera automatiquement.</p>
        </div>

        <!-- Drawer -->
        <div id="overlay" class="overlay"></div>
        <aside id="sideMenu" class="side-menu shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-extrabold text-xl tracking-tight">Réglages Live</h2>
                <button id="closeMenu" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-white/5 flex items-center justify-center">
                    <i class="fas fa-times text-slate-400"></i>
                </button>
            </div>

            <div class="space-y-6 flex-1 overflow-y-auto">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Ma Langue</label>
                    <select id="langSelect" class="w-full p-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl font-semibold outline-none">
                        <option value="fr-FR">Français (Origine)</option>
                        <option value="en-US">English (US)</option>
                        <option value="es-ES">Español (ES)</option>
                        <option value="de-DE">Deutsch (DE)</option>
                        <option value="it-IT">Italiano (IT)</option>
                        <option value="pt-PT">Português (PT)</option>
                    </select>
                </div>

                <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-white/5 rounded-2xl">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-700 dark:text-gray-300">Traduction Vocale</span>
                        <span class="text-[10px] text-slate-400">Synthèse intelligente</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleTTS" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 dark:bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-fb"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-white/5 rounded-2xl">
                    <div class="flex flex-col">
                        <span class="font-bold">Mode Miniature</span>
                        <span class="text-[10px] text-slate-400">Voir la source orateur</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleOriginal" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 dark:bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-fb"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-white/5 rounded-2xl">
                    <span class="font-bold">Mode Sombre</span>
                    <button id="themeToggle" class="w-10 h-10 rounded-xl bg-white dark:bg-white/10 shadow-sm flex items-center justify-center">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                </div>

                <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-white/5">
                    <div class="px-1 flex justify-between items-center mb-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Volume Direct</label>
                        <span id="volVal" class="font-bold text-fb">80%</span>
                    </div>
                    <input type="range" id="liveVolume" min="0" max="1" step="0.1" value="0.8" class="w-full accent-fb">
                </div>
            </div>

            <div class="mt-8 pt-4 border-t border-slate-100 dark:border-white/5 text-center">
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Orateur Pro // v6.0 Pro App</span>
            </div>
        </aside>

        <!-- Header -->
        <header class="header-app flex justify-between items-center">
            <button id="openMenu" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-50 dark:bg-white/5">
                <i class="fas fa-bars-staggered"></i>
            </button>

            <div class="flex flex-col items-center text-center px-2">
                <span class="font-black text-[12px] tracking-tight text-slate-900 dark:text-white uppercase">Orateur Pro</span>
                <div id="live-status" class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span class="text-[9px] font-black text-red-500 uppercase tracking-widest">En Direct</span>
                </div>
                <div id="speaking-box" class="speaking-indicator hidden">
                    <i class="fas fa-wave-square animate-pulse"></i> L'ORATEUR PARLE
                </div>
            </div>

            <div class="w-10 h-10 rounded-full border-2 border-fb/10 flex items-center justify-center">
                <i class="fas fa-volume-up text-fb text-xs"></i>
            </div>
        </header>

        <!-- Main Stream -->
        <main class="stream-viewport" id="scrollBox">
            <div id="stream-content" class="w-full flex flex-col"></div>
            <div id="interim-block" class="phrase-card opacity-50 hidden italic border-fb/20 border-dashed text-fb"></div>
        </main>
    </div>

    <script>
        // Disable Browser Back
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);

        const UI = {
            menu: document.getElementById('sideMenu'),
            overlay: document.getElementById('overlay'),
            open: document.getElementById('openMenu'),
            close: document.getElementById('closeMenu'),
            scroll: document.getElementById('scrollBox'),
            content: document.getElementById('stream-content'),
            interim: document.getElementById('interim-block'),
            offline: document.getElementById('offline-screen'),
            speaking: document.getElementById('speaking-box'),
            liveTag: document.getElementById('live-status'),
            lang: document.getElementById('langSelect'),
            vol: document.getElementById('liveVolume'),
            volVal: document.getElementById('volVal'),
            ttsToggle: document.getElementById('toggleTTS'),
            origToggle: document.getElementById('toggleOriginal'),
            theme: document.getElementById('themeToggle')
        };

        let lastTS = 0;
        let lastSpeakText = "";
        const synth = window.speechSynthesis;

        const rtcState = {
            pc: null, audio: new Audio(), candidatesAdded: new Set()
        };

        function logVoice(msg) {
            fetch('log_voice.php', { method: 'POST', body: 'log=' + encodeURIComponent(msg), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
        }

        UI.open.onclick = () => { UI.menu.classList.add('open'); UI.overlay.classList.add('show'); };
        UI.close.onclick = UI.overlay.onclick = () => { UI.menu.classList.remove('open'); UI.overlay.classList.remove('show'); };
        UI.theme.onclick = () => document.documentElement.classList.toggle('dark');
        UI.vol.oninput = () => { rtcState.audio.volume = UI.vol.value; UI.volVal.innerText = Math.round(UI.vol.value*100) + '%'; };

        function getBestVoice(lang) {
            const voices = synth.getVoices();
            return voices.find(v => v.lang === lang && (v.name.includes('Google') || v.name.includes('Premium'))) || voices.find(v => v.lang.startsWith(lang.split('-')[0])) || voices[0];
        }

        function speak(text, isInterim = false) {
            if (!UI.ttsToggle.checked || !text?.trim()) return;
            if (text === lastSpeakText) return;
            lastSpeakText = text;

            synth.cancel();
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                const target = UI.lang.value;
                utterance.lang = target;
                utterance.voice = getBestVoice(target);
                utterance.rate = isInterim ? 1.3 : 1.1;

                utterance.onstart = () => rtcState.audio.volume = UI.vol.value * 0.15;
                utterance.onend = () => rtcState.audio.volume = UI.vol.value;
                utterance.onerror = () => rtcState.audio.volume = UI.vol.value;

                synth.speak(utterance);
            }, 30);
        }

        async function fastTranslate(text) {
            const target = UI.lang.value.split('-')[0];
            if (target === 'fr') return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) { return text; }
        }

        async function poll() {
            try {
                const res = await fetch('post.php?t=' + Date.now());
                const data = await res.json();

                const now = Date.now();
                const isRecentlyActive = (now - data.timestamp) < 10000;
                const liveActive = data.is_live && isRecentlyActive;

                UI.offline.classList.toggle('hidden', liveActive);
                UI.speaking.classList.toggle('hidden', !data.is_speaking || !liveActive);
                UI.liveTag.classList.toggle('opacity-0', !liveActive);

                if (liveActive && data.timestamp > lastTS) {
                    lastTS = data.timestamp;
                    if (data.type === 'interim') {
                        UI.interim.classList.remove('hidden');
                        const translated = await fastTranslate(data.text);
                        UI.interim.innerText = translated;
                        if (translated.split(' ').length > 8) speak(translated, true);
                    } else if (data.text) {
                        UI.interim.classList.add('hidden');
                        const translated = await fastTranslate(data.text);
                        const card = document.createElement('div');
                        card.className = 'phrase-card';
                        const showOrig = UI.origToggle.checked ? 'show' : '';
                        card.innerHTML = `
                            <div class="text-orig ${showOrig}">${data.text}</div>
                            <div class="font-bold text-slate-800 dark:text-white leading-relaxed">${translated}</div>
                        `;
                        UI.content.appendChild(card);
                        speak(translated, false);
                    }
                    UI.scroll.scrollTop = UI.scroll.scrollHeight;
                }
            } catch (e) {}
        }

        setInterval(poll, 400);

        async function initRTC() {
            if (rtcState.pc) rtcState.pc.close();
            rtcState.pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            rtcState.pc.ontrack = (e) => { rtcState.audio.srcObject = e.streams[0]; rtcState.audio.play(); };
            rtcState.pc.onicecandidate = (e) => { if (e.candidate) fetch('signaling.php?action=push&role=auditor', { method: 'POST', body: JSON.stringify({ candidate: e.candidate }) }); };

            setInterval(async () => {
                const res = await fetch('signaling.php');
                const sig = await res.json();
                if (sig.offer && rtcState.pc.signalingState === 'stable') {
                    await rtcState.pc.setRemoteDescription(new RTCSessionDescription(sig.offer));
                    const ans = await rtcState.pc.createAnswer();
                    await rtcState.pc.setLocalDescription(ans);
                    fetch('signaling.php?action=push&role=auditor', { method: 'POST', body: JSON.stringify({ answer: ans }) });
                }
                if (sig.orator_candidates && rtcState.pc.remoteDescription) {
                    sig.orator_candidates.forEach(c => {
                        if (c && !rtcState.candidatesAdded.has(JSON.stringify(c))) {
                            rtcState.pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
                            rtcState.candidatesAdded.add(JSON.stringify(c));
                        }
                    });
                }
            }, 3000);
        }

        window.addEventListener('click', () => {
            rtcState.audio.play().catch(()=>{});
            const unlock = new SpeechSynthesisUtterance("");
            synth.speak(unlock);
            initRTC();
        }, { once: true });

        synth.onvoiceschanged = () => console.log("Voices ready");
    </script>
</body>
</html>
