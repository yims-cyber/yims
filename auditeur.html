<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orateur Pro - Espace Auditeur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-size: 13px !important; font-family: 'Inter', sans-serif !important; }
        body { background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 0; }

        /* Mobile App Container */
        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }

        .header-app {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .scroll-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .bottom-nav {
            padding: 15px 20px;
            border-top: 1px solid #f1f5f9;
            background: #fafafa;
        }

        .chat-bubble {
            background: #f8fafc;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            border-bottom-left-radius: 4px;
            border: 1px solid #edf2f7;
        }

        .chat-bubble.interim {
            background: transparent;
            border: 1px dashed #cbd5e1;
            color: #64748b;
        }

        select, input[type="range"] {
            font-size: 11px !important;
        }

        .pulse-live {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="app-container flex flex-col">
        <!-- App Header -->
        <header class="header-app flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                    <i class="fas fa-headphones-simple"></i>
                </div>
                <div>
                    <h1 class="font-bold text-gray-900 tracking-tight">Orateur <span class="text-indigo-600">Pro</span></h1>
                    <div class="flex items-center">
                        <span class="pulse-live"></span>
                        <span class="text-[10px] font-bold uppercase text-red-500 tracking-widest">En Direct</span>
                    </div>
                </div>
            </div>
            <button id="playBtn" class="w-9 h-9 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center hover:bg-indigo-100 transition-colors">
                <i class="fas fa-volume-up"></i>
            </button>
        </header>

        <!-- Main Stream Area -->
        <main class="scroll-area flex flex-col" id="streamContainer">
            <div class="flex-1 flex flex-col justify-center text-center py-10" id="emptyState">
                <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                    <i class="fas fa-tower-broadcast text-2xl"></i>
                </div>
                <p class="text-gray-400 font-medium">En attente du signal...</p>
                <p class="text-[11px] text-gray-300 px-10 mt-2">Dès que l'orateur commencera, la transcription s'affichera ici.</p>
            </div>

            <div id="liveContent" class="hidden space-y-4">
                <div id="translatedBox" class="text-xl font-semibold leading-relaxed text-gray-800 mb-6">
                    <!-- Text arrives here -->
                </div>
                <div id="originalBox" class="text-xs text-gray-400 italic border-t border-gray-50 pt-4 hidden">
                    <!-- Original text here -->
                </div>
            </div>
        </main>

        <!-- App Controls -->
        <footer class="bottom-nav space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Ma Langue</label>
                    <select id="targetLang" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-100">
                        <option value="none">Original (Français)</option>
                        <option value="en">English (US)</option>
                        <option value="es">Español</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Vitesse Audio</label>
                    <div class="flex items-center gap-2 px-1">
                        <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1" class="flex-1 accent-indigo-600">
                        <span id="rateVal" class="text-[10px] font-bold text-indigo-600 w-6">1x</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between bg-white p-3 rounded-2xl border border-gray-100">
                <div class="flex items-center gap-3">
                    <i class="fas fa-align-left text-gray-300"></i>
                    <span class="text-[11px] font-medium text-gray-600">Afficher l'original</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="showOriginal" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
                </label>
            </div>
        </footer>
    </div>

    <script>
        const elements = {
            stream: document.getElementById('streamContainer'),
            empty: document.getElementById('emptyState'),
            content: document.getElementById('liveContent'),
            translated: document.getElementById('translatedBox'),
            original: document.getElementById('originalBox'),
            targetLang: document.getElementById('targetLang'),
            rate: document.getElementById('rate'),
            rateVal: document.getElementById('rateVal'),
            showOriginal: document.getElementById('showOriginal'),
            playBtn: document.getElementById('playBtn')
        };

        let lastTimestamp = 0;
        const synth = window.speechSynthesis;

        async function translate(text, target) {
            if (target === 'none' || !text) return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0][0][0];
            } catch (e) { return text; }
        }

        function speak(text, lang) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'none' ? 'fr-FR' : lang;
            utterance.rate = parseFloat(elements.rate.value);

            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.startsWith(utterance.lang));
            if (voice) utterance.voice = voice;

            synth.speak(utterance);
        }

        // Liaison Logic: Polling the server
        async function pollServer() {
            try {
                // Fetch from the liaison file
                const response = await fetch('broadcast.json?t=' + Date.now());
                if (!response.ok) return;

                const data = await response.json();

                // Only process new data
                if (data.timestamp > lastTimestamp) {
                    lastTimestamp = data.timestamp;

                    elements.empty.classList.add('hidden');
                    elements.content.classList.remove('hidden');

                    const target = elements.targetLang.value;

                    if (data.type === 'interim') {
                        elements.translated.innerHTML = `<span class="text-indigo-600/40 italic">${data.text}...</span>`;
                    } else if (data.type === 'final') {
                        const result = await translate(data.text, target);
                        elements.translated.innerHTML = `<span class="text-gray-800">${result}</span>`;
                        elements.original.innerText = data.text;
                        speak(result, target);
                    }
                }
            } catch (err) {
                // Ignore errors
            }
        }

        // Start Polling (every 500ms for responsiveness)
        setInterval(pollServer, 500);

        // UI Listeners
        elements.rate.oninput = () => elements.rateVal.innerText = elements.rate.value + 'x';
        elements.showOriginal.onchange = () => {
            elements.original.classList.toggle('hidden', !elements.showOriginal.checked);
        };

        // Manual play for mobile auto-play restrictions
        elements.playBtn.onclick = () => {
            const text = elements.translated.innerText;
            if (text && text.length > 5) speak(text, elements.targetLang.value);
        };
    </script>
</body>
</html>
