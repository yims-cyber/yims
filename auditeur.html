<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orateur Pro - Auditeur Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fb: '#1877f2',
                        obsidian: '#0a0a0b'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-size: 13px !important; transition: all 0.25s ease; }
        html, body { font-family: 'Inter', sans-serif; height: 100%; margin: 0; padding: 0; overflow: hidden; }

        body { background-color: #f0f2f5; } /* Facebook-style background */
        .dark body { background-color: #050505; }

        .app-container {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .dark .app-container { background-color: #0a0a0b; }

        /* Professional Header */
        .header-app {
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #e4e6eb;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dark .header-app { background: #1c1e21; border-bottom: 1px solid #3e4042; }

        /* Side Menu Drawer */
        .side-menu {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            height: 100%;
            background: #ffffff;
            z-index: 100;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .dark .side-menu { background: #1c1e21; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .side-menu.open { left: 0; }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 90;
            display: none;
        }
        .overlay.show { display: block; }

        /* Transcription Cards Area */
        .stream-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
        }
        .dark .stream-viewport { background: #050505; }
        .stream-viewport::-webkit-scrollbar { display: none; }
        .stream-viewport { -ms-overflow-style: none; scrollbar-width: none; }

        .phrase-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            border: 1px solid #e4e6eb;
        }
        .dark .phrase-card { background: #242526; border: 1px solid #3e4042; box-shadow: none; }

        .text-main {
            font-size: 13px !important;
            font-weight: 500;
            color: #050505;
            line-height: 1.4;
        }
        .dark .text-main { color: #e4e6eb; }

        .text-orig {
            font-size: 10px !important;
            font-weight: 600;
            color: #65676b;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: none;
        }
        .dark .text-orig { color: #b0b3b8; }
        .text-orig.show { display: block; }

        .live-tag {
            color: #fa3e3e;
            font-weight: 800;
            font-size: 9px !important;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pulse {
            width: 6px; height: 6px; background: #fa3e3e; border-radius: 50%;
            animation: pulse-kf 1s infinite;
        }
        @keyframes pulse-kf { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .btn-circle {
            width: 34px; height: 34px; border-radius: 50%;
            background: #e4e6eb;
            display: flex; items-center: center; justify-content: center;
            color: #050505;
        }
        .dark .btn-circle { background: #3a3b3c; color: #e4e6eb; }

        select, input[type="range"] {
            width: 100%;
            background: #f0f2f5;
            border: 1px solid #dddfe2;
            border-radius: 8px;
            padding: 8px;
            outline: none;
        }
        .dark select, .dark input[type="range"] { background: #3a3b3c; border: 1px solid #3e4042; color: white; }
    </style>
</head>
<body class="light"> <!-- Default to White/Light Mode -->
    <div class="app-container">

        <!-- Side Menu Drawer -->
        <div id="overlay" class="overlay"></div>
        <aside id="sideMenu" class="side-menu">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-bold text-lg">Paramètres</h2>
                <button id="closeMenu" class="text-gray-500"><i class="fas fa-times"></i></button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block">Langue de traduction</label>
                    <select id="langSelect">
                        <option value="none">Français (Origine)</option>
                        <option value="en">English (US)</option>
                        <option value="es">Español</option>
                        <option value="de">Deutsch</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block">Vitesse de lecture</label>
                    <div class="flex items-center gap-3">
                        <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="1">
                        <span id="rateLabel" class="font-bold">1.0x</span>
                    </div>
                </div>

                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-white/5 rounded-xl">
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Mode Miniature</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleOriginal" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-300 dark:bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-fb"></div>
                    </label>
                </div>

                <div class="pt-4 border-t border-gray-100 dark:border-white/5">
                    <button id="testAudioBtn" class="w-full bg-fb text-white py-3 rounded-xl font-bold">
                        <i class="fas fa-play-circle mr-2"></i> Tester la voix
                    </button>
                </div>

                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-white/5 rounded-xl">
                    <span class="font-semibold">Mode Sombre</span>
                    <button id="themeToggle" class="btn-circle" style="display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block"></i>
                    </button>
                </div>
            </div>

            <div class="mt-auto text-[10px] text-gray-400 text-center">
                Orateur Pro v4.5 // Diagnostic actif
            </div>
        </aside>

        <!-- Header -->
        <header class="header-app">
            <button id="openMenu" class="btn-circle" style="display:flex; align-items:center; justify-content:center;">
                <i class="fas fa-bars"></i>
            </button>

            <div class="flex flex-col items-center">
                <span class="font-bold text-[13px] tracking-tight">Orateur Pro</span>
                <div class="live-tag">
                    <div class="pulse"></div> EN DIRECT
                </div>
            </div>

            <button id="speakerBtn" class="btn-circle" style="display:flex; align-items:center; justify-content:center;">
                <i class="fas fa-volume-mute text-red-500" id="speakerIcon"></i>
            </button>
        </header>

        <!-- Stream Area -->
        <main class="stream-viewport" id="scrollBox">
            <div id="empty-state" class="my-auto text-center space-y-4 opacity-40">
                <i class="fas fa-satellite-dish text-4xl text-fb"></i>
                <p class="font-medium">En attente de transmission live...</p>
            </div>

            <div id="stream-content" class="hidden w-full"></div>
            <div id="interim-block" class="phrase-card opacity-60 hidden italic"></div>
        </main>

    </div>

    <script>
        const UI = {
            menu: document.getElementById('sideMenu'),
            overlay: document.getElementById('overlay'),
            open: document.getElementById('openMenu'),
            close: document.getElementById('closeMenu'),
            scroll: document.getElementById('scrollBox'),
            content: document.getElementById('stream-content'),
            interim: document.getElementById('interim-block'),
            empty: document.getElementById('empty-state'),
            lang: document.getElementById('langSelect'),
            rate: document.getElementById('rateRange'),
            rateLabel: document.getElementById('rateLabel'),
            toggle: document.getElementById('toggleOriginal'),
            speaker: document.getElementById('speakerBtn'),
            speakerIcon: document.getElementById('speakerIcon'),
            theme: document.getElementById('themeToggle'),
            test: document.getElementById('testAudioBtn')
        };

        let lastTS = 0;
        let ttsActive = false;
        const synth = window.speechSynthesis;

        // Logging System
        function logVoice(msg) {
            console.log(msg);
            fetch('log_voice.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'log=' + encodeURIComponent(msg)
            });
        }

        // Menu Logic
        UI.open.onclick = () => { UI.menu.classList.add('open'); UI.overlay.classList.add('show'); };
        UI.close.onclick = UI.overlay.onclick = () => { UI.menu.classList.remove('open'); UI.overlay.classList.remove('show'); };
        UI.theme.onclick = () => document.body.classList.toggle('dark');

        // TTS Logic with debounce and error handling
        let ttsTimeout = null;
        function speak(text) {
            if (!ttsActive || !text) return;

            // Clear any pending speak request
            if (ttsTimeout) clearTimeout(ttsTimeout);

            ttsTimeout = setTimeout(() => {
                try {
                    // Stop current speaking
                    synth.cancel();

                    // Small delay after cancel to allow the engine to reset (crucial for Chrome)
                    setTimeout(() => {
                        const utterance = new SpeechSynthesisUtterance(text);
                        const target = UI.lang.value === 'none' ? 'fr-FR' : UI.lang.value;
                        utterance.lang = target;

                        const voices = synth.getVoices();
                        const voice = voices.find(v => v.lang.startsWith(target) && (v.name.includes('Google') || v.name.includes('Premium')))
                                      || voices.find(v => v.lang.startsWith(target));

                        if (voice) utterance.voice = voice;
                        utterance.rate = parseFloat(UI.rate.value);

                        utterance.onerror = (e) => logVoice(`TTS Error: ${e.error} | Text: ${text.substring(0,20)} | Voice: ${voice ? voice.name : 'none'}`);
                        utterance.onstart = () => logVoice("TTS Start: " + text.substring(0, 20));

                        synth.speak(utterance);
                    }, 50);
                } catch (err) {
                    logVoice("TTS Exception: " + err.message);
                }
            }, 100); // 100ms debounce
        }

        let lastTestTrigger = 0;
        UI.test.onclick = () => {
            const now = Date.now();
            if (now - lastTestTrigger < 1000) return; // Prevent spamming
            lastTestTrigger = now;

            logVoice("Test audio triggered");
            speak("Test du système audio Orateur Pro.");
        };

        UI.speaker.onclick = () => {
            ttsActive = !ttsActive;
            UI.speakerIcon.className = ttsActive ? "fas fa-volume-up text-fb" : "fas fa-volume-mute text-red-500";
            if (ttsActive) {
                logVoice("Speaker activated by user");
                synth.cancel();
                const unlock = new SpeechSynthesisUtterance("Lecture activée");
                unlock.lang = 'fr-FR';
                unlock.volume = 0.5;
                synth.speak(unlock);
            } else {
                synth.cancel();
                logVoice("Speaker deactivated");
            }
        };

        async function fastTranslate(text) {
            const target = UI.lang.value;
            if (target === 'none' || !text) return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) { return text; }
        }

        async function refresh() {
            try {
                const res = await fetch('broadcast.json?t=' + Date.now());
                const data = await res.json();

                if (data.timestamp > lastTS) {
                    lastTS = data.timestamp;
                    UI.empty.classList.add('hidden');
                    UI.content.classList.remove('hidden');

                    if (data.type === 'interim') {
                        UI.interim.classList.remove('hidden');
                        UI.interim.innerText = await fastTranslate(data.text);
                    } else {
                        UI.interim.classList.add('hidden');
                        const translated = await fastTranslate(data.text);

                        const card = document.createElement('div');
                        card.className = 'phrase-card';
                        const showOrig = UI.toggle.checked ? 'show' : '';
                        card.innerHTML = `
                            <div class="text-orig ${showOrig}">${data.text}</div>
                            <div class="text-main">${translated}</div>
                        `;
                        UI.content.appendChild(card);
                        speak(translated);
                    }
                    UI.scroll.scrollTop = UI.scroll.scrollHeight;
                }
            } catch (e) {}
        }

        setInterval(refresh, 300);
        UI.rate.oninput = () => UI.rateLabel.innerText = UI.rate.value + 'x';

        // Initial log
        logVoice("Auditor page loaded. Synth available: " + (!!window.speechSynthesis));
        synth.onvoiceschanged = () => logVoice("Voices loaded: " + synth.getVoices().length);
    </script>
</body>
</html>
