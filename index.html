<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORATEUR ULTRA - Signalisation Neurale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-purple: #bc13fe;
            --bg-deep: #050505;
            --glass: rgba(15, 15, 15, 0.7);
            --border-glass: rgba(0, 242, 255, 0.15);
        }

        body {
            background-color: var(--bg-deep);
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Block scroll for desktop */
            height: 100vh;
        }

        @media (max-width: 1024px) {
            body {
                overflow: auto;
                height: auto;
            }
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 242, 255, 0.1);
            opacity: 0.5;
            z-index: 100;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .neon-border {
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .neon-text-cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.5);
        }

        .neon-text-purple {
            color: var(--neon-purple);
            text-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
        }

        .pulsing-analyse {
            animation: pulse-analyse 1.5s infinite alternate;
        }

        @keyframes pulse-analyse {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .spinning-satellite {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 2px; }

        /* Unified 13px font size */
        .text-global { font-size: 13px; }
    </style>
</head>
<body class="text-global flex flex-col">
    <div class="scanline"></div>

    <!-- Header -->
    <header class="h-[64px] min-h-[64px] border-b border-cyan-500/20 flex items-center px-6 justify-between glass-panel z-50 flex-wrap gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">
                <i class="fas fa-satellite-dish neon-text-cyan spinning-satellite"></i>
            </div>
            <div>
                <h1 class="orbitron font-bold text-lg leading-none neon-text-cyan tracking-wider">ORATEUR ULTRA</h1>
                <p class="text-[10px] uppercase tracking-[0.2em] text-cyan-500/60 font-semibold">Signalisation Neurale & Transcription</p>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-gray-500 shadow-[0_0_8px_rgba(156,163,175,0.5)]"></span>
                <span id="statusText" class="orbitron text-[11px] font-bold uppercase tracking-widest text-gray-400">Prêt</span>
            </div>
            <div class="h-8 w-[1px] bg-cyan-500/20"></div>
            <div class="flex items-center gap-3">
                <i class="fas fa-clock text-purple-500"></i>
                <span id="timer" class="orbitron font-bold tabular-nums">00:00:00</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-12 gap-6 p-6 overflow-hidden">

        <!-- Left: Audio Controls & Visualizer -->
        <div class="col-span-12 lg:col-span-4 flex flex-col gap-6 overflow-y-auto custom-scrollbar">

            <!-- Audio Engine Card -->
            <div class="glass-panel p-5 rounded-lg flex flex-col gap-4 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-2">
                    <div id="analyseIndicator" class="hidden pulsing-analyse flex items-center gap-2 px-2 py-1 bg-cyan-500/10 border border-cyan-500/30 rounded">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                        <span class="orbitron text-[9px] font-bold text-cyan-400">ANALYSE</span>
                    </div>
                </div>

                <div class="flex justify-between items-end">
                    <label class="orbitron text-[11px] font-bold text-cyan-500/70 uppercase tracking-widest">Audio Engine</label>
                    <span id="dbValue" class="orbitron text-xs font-bold neon-text-cyan">-∞ dB</span>
                </div>

                <div class="h-1 bg-black/40 rounded-full overflow-hidden border border-cyan-500/10">
                    <div id="dbMeter" class="h-full bg-gradient-to-r from-cyan-600 to-purple-600 w-0 transition-all duration-75"></div>
                </div>

                <canvas id="visualizer" class="w-full h-24 bg-black/20 rounded border border-white/5"></canvas>

                <!-- Metrics Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-black/40 p-3 rounded border border-white/5 flex flex-col gap-1">
                        <span class="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Qualité</span>
                        <span id="qualityLabel" class="orbitron text-xs font-bold text-gray-400">---</span>
                    </div>
                    <div class="bg-black/40 p-3 rounded border border-white/5 flex flex-col gap-1">
                        <span class="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Bruit / SNR</span>
                        <span id="noiseLabel" class="orbitron text-xs font-bold text-gray-400">---</span>
                    </div>
                    <div class="bg-black/40 p-3 rounded border border-white/5 flex flex-col gap-1">
                        <span class="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Voix Secondaires</span>
                        <span id="secondaryLabel" class="orbitron text-xs font-bold text-gray-400">---</span>
                    </div>
                    <div class="bg-black/40 p-3 rounded border border-white/5 flex flex-col gap-1">
                        <span class="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Stabilité</span>
                        <span id="stabilityLabel" class="orbitron text-xs font-bold text-gray-400">---</span>
                    </div>
                </div>
            </div>

            <!-- Main Controls -->
            <div class="glass-panel p-5 rounded-lg flex flex-col gap-4">
                <button id="toggleBtn" class="group relative w-full py-4 bg-transparent border border-cyan-500/50 rounded flex items-center justify-center gap-3 overflow-hidden transition-all hover:border-cyan-400 hover:shadow-[0_0_15px_rgba(0,242,255,0.2)]">
                    <div class="absolute inset-0 bg-cyan-500/5 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                    <i class="fas fa-play text-cyan-400" id="toggleIcon"></i>
                    <span id="toggleText" class="orbitron font-bold tracking-[0.2em] text-cyan-400">INITIALISER L'ÉCOUTE</span>
                </button>

                <div class="grid grid-cols-2 gap-4">
                    <button id="copyBtn" class="py-2.5 bg-white/5 border border-white/10 rounded orbitron text-[11px] font-bold hover:bg-white/10 transition-colors uppercase tracking-widest">
                        <i class="fas fa-fingerprint mr-2 text-purple-500"></i> Copier Flux
                    </button>
                    <button id="exportBtn" class="py-2.5 bg-white/5 border border-white/10 rounded orbitron text-[11px] font-bold hover:bg-white/10 transition-colors uppercase tracking-widest">
                        <i class="fas fa-download mr-2 text-purple-500"></i> Exporter
                    </button>
                </div>

                <div class="pt-4 border-t border-cyan-500/10 flex justify-between items-center px-1">
                    <span class="text-[11px] text-gray-500 font-semibold uppercase tracking-widest">Signal Status</span>
                    <span id="permStatus" class="orbitron text-[10px] font-bold text-gray-400">EN ATTENTE</span>
                </div>
            </div>
        </div>

        <!-- Right: Real-time Flux & History -->
        <div class="col-span-12 lg:col-span-8 flex flex-col gap-6 overflow-hidden">
            <!-- Live Transcription Area -->
            <div class="glass-panel p-8 rounded-lg flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>

                <div class="flex items-center gap-2 mb-6">
                    <i class="fas fa-wave-square neon-text-purple text-xs"></i>
                    <span class="orbitron text-[11px] font-bold text-purple-400 uppercase tracking-[0.3em]">Flux Neural en Direct</span>
                </div>

                <div id="transcript" class="flex-1 overflow-y-auto custom-scrollbar pr-4">
                    <div class="h-full flex items-center justify-center opacity-20 italic orbitron text-sm tracking-widest">
                        Initialisation du moteur requise...
                    </div>
                </div>
            </div>

            <!-- History Summary -->
            <div class="glass-panel p-6 rounded-lg h-[250px] flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-database text-cyan-500 text-xs"></i>
                        <h3 class="orbitron text-[11px] font-bold text-cyan-500/70 uppercase tracking-widest">Registres de Session</h3>
                    </div>
                    <button id="clearHistory" class="text-[10px] font-bold text-red-500/60 hover:text-red-500 transition-colors orbitron uppercase tracking-widest">Nettoyage Global</button>
                </div>

                <div id="historyList" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                    <div class="text-center py-8 opacity-10 orbitron text-[10px] tracking-widest">Aucun registre disponible</div>
                </div>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 glass-panel border-red-500/50 rounded-full opacity-0 pointer-events-none transition-all duration-300 z-[1000] flex items-center gap-3">
        <i class="fas fa-radiation text-red-500 animate-pulse"></i>
        <span id="toastMsg" class="orbitron text-[11px] font-bold text-red-400 uppercase tracking-wider">Alerte Signal Critique</span>
    </div>

    <script>
        const state = {
            isListening: false,
            isSpeaking: false,
            startTime: null,
            timerInterval: null,
            db: -100,
            noiseFloor: -60,
            vadThreshold: -45,
            lastDb: -100,
            history: JSON.parse(localStorage.getItem('orateur_ultra_history') || '[]')
        };

        const elements = {
            toggleBtn: document.getElementById('toggleBtn'),
            toggleIcon: document.getElementById('toggleIcon'),
            toggleText: document.getElementById('toggleText'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            timer: document.getElementById('timer'),
            dbValue: document.getElementById('dbValue'),
            dbMeter: document.getElementById('dbMeter'),
            visualizer: document.getElementById('visualizer'),
            analyseIndicator: document.getElementById('analyseIndicator'),
            permStatus: document.getElementById('permStatus'),
            transcript: document.getElementById('transcript'),
            historyList: document.getElementById('historyList'),
            qualityLabel: document.getElementById('qualityLabel'),
            noiseLabel: document.getElementById('noiseLabel'),
            secondaryLabel: document.getElementById('secondaryLabel'),
            stabilityLabel: document.getElementById('stabilityLabel'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toastMsg')
        };

        let audioContext, analyser, source, stream, recognition;

        function initRecognition() {
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                showToast("Reconnaissance vocale non supportée");
                return;
            }
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        savePhrase(event.results[i][0].transcript.trim());
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                if (interimTranscript) {
                    elements.transcript.innerHTML = `<span class="text-cyan-400 opacity-60">${interimTranscript}</span>`;
                }
            };

            recognition.onend = () => {
                if (state.isListening) recognition.start();
            };
        }

        function savePhrase(phrase) {
            if (!phrase) return;
            phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);

            const item = {
                id: Date.now(),
                text: phrase,
                time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
            };

            state.history.unshift(item);
            if (state.history.length > 50) state.history.pop();
            localStorage.setItem('orateur_ultra_history', JSON.stringify(state.history));

            renderHistory();
            elements.transcript.innerHTML = `<span class="neon-text-cyan">${phrase}</span>`;

            // Signal to backend
            fetch('post.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `msg=${encodeURIComponent(phrase)}&post=yes`
            }).catch(() => {});
        }

        function renderHistory() {
            elements.historyList.innerHTML = state.history.map(item => `
                <div class="bg-black/20 border border-white/5 p-3 rounded flex gap-4 items-start hover:border-cyan-500/30 transition-colors">
                    <span class="orbitron text-[9px] text-purple-500 mt-1">${item.time}</span>
                    <p class="text-sm text-gray-300 leading-relaxed">${item.text}</p>
                </div>
            `).join('') || '<div class="text-center py-8 opacity-10 orbitron text-[10px] tracking-widest">Aucun registre disponible</div>';
        }

        async function initAudio() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;

                source.connect(analyser);
                elements.permStatus.innerText = "ACTIF";
                elements.permStatus.classList.replace('text-gray-400', 'text-cyan-400');

                processAudio();
            } catch (err) {
                showToast("Accès Micro Refusé");
                elements.permStatus.innerText = "ERREUR";
                elements.permStatus.classList.replace('text-gray-400', 'text-red-500');
            }
        }

        function processAudio() {
            if (!state.isListening) return;
            requestAnimationFrame(processAudio);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // 1. Calculate dB
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let average = sum / dataArray.length;
            let db = 20 * Math.log10(average / 255);
            if (isNaN(db) || db === -Infinity) db = -100;
            state.db = db;

            // 2. VAD & Noise Floor
            if (db > state.vadThreshold) {
                state.isSpeaking = true;
                elements.analyseIndicator.classList.remove('hidden');
                calculateMetrics(db, dataArray);
            } else {
                state.isSpeaking = false;
                elements.analyseIndicator.classList.add('hidden');
                resetMetricsUI();
                // Track noise floor during silence
                state.noiseFloor = (state.noiseFloor * 0.95) + (db * 0.05);
            }

            updateAudioUI(db);
            drawVisualizer(dataArray);
            state.lastDb = db;
        }

        function drawVisualizer(dataArray) {
            const canvas = elements.visualizer;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);
            const barWidth = (width / dataArray.length) * 2.5;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * height;
                const gradient = ctx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, '#00f2ff33');
                gradient.addColorStop(1, '#bc13feaa');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        function calculateMetrics(db, dataArray) {
            // 1. SNR (Signal-to-Noise Ratio)
            const snr = db - state.noiseFloor;
            elements.noiseLabel.innerText = `${snr.toFixed(1)} dB SNR`;
            elements.noiseLabel.className = `orbitron text-xs font-bold ${snr > 20 ? 'text-green-400' : 'text-yellow-500'}`;

            // 2. Sound Quality
            let quality = "OPTIMALE";
            let qColor = "text-green-400";
            if (db > -5) { quality = "SATURATION"; qColor = "text-red-500"; }
            else if (snr < 15) { quality = "BRUITÉ"; qColor = "text-yellow-500"; }
            else if (db < -35) { quality = "FAIBLE"; qColor = "text-cyan-400"; }
            elements.qualityLabel.innerText = quality;
            elements.qualityLabel.className = `orbitron text-xs font-bold ${qColor}`;

            // 3. Secondary Voices (Energy outside 300Hz-3kHz)
            // Analyser range: 0 to sampleRate/2. Standard sampleRate: 44.1kHz or 48kHz.
            // Frequency per bin = (sampleRate/2) / bufferLength.
            const binSize = (audioContext.sampleRate / 2) / dataArray.length;
            let secondaryEnergy = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const freq = i * binSize;
                if (freq < 300 || freq > 3000) {
                    secondaryEnergy += dataArray[i];
                }
            }
            const avgSecondary = secondaryEnergy / dataArray.length;
            const hasSecondary = avgSecondary > 40;
            elements.secondaryLabel.innerText = hasSecondary ? "DÉTECTÉES" : "AUCUNE";
            elements.secondaryLabel.className = `orbitron text-xs font-bold ${hasSecondary ? 'text-red-400' : 'text-gray-400'}`;

            // 4. Stability (Variance)
            const variance = Math.abs(db - state.lastDb);
            const isStable = variance < 5;
            elements.stabilityLabel.innerText = isStable ? "STABLE" : "INSTABLE";
            elements.stabilityLabel.className = `orbitron text-xs font-bold ${isStable ? 'text-green-400' : 'text-orange-400'}`;
        }

        function resetMetricsUI() {
            elements.qualityLabel.innerText = "SILENCE";
            elements.qualityLabel.className = "orbitron text-xs font-bold text-gray-500";
            elements.noiseLabel.innerText = "---";
            elements.noiseLabel.className = "orbitron text-xs font-bold text-gray-500";
            elements.secondaryLabel.innerText = "---";
            elements.secondaryLabel.className = "orbitron text-xs font-bold text-gray-500";
            elements.stabilityLabel.innerText = "---";
            elements.stabilityLabel.className = "orbitron text-xs font-bold text-gray-500";
        }

        function updateAudioUI(db) {
            elements.dbValue.innerText = `${db.toFixed(1)} dB`;
            let percentage = Math.max(0, (db + 70) * 1.4);
            elements.dbMeter.style.width = `${percentage}%`;

            if (db > -5) showToast("Saturation Signal !");
        }

        function showToast(msg) {
            elements.toastMsg.innerText = msg;
            elements.toast.style.opacity = '1';
            setTimeout(() => elements.toast.style.opacity = '0', 3000);
        }

        elements.toggleBtn.addEventListener('click', async () => {
            if (!state.isListening) {
                if (!audioContext) await initAudio();
                if (!recognition) initRecognition();

                state.isListening = true;
                state.startTime = Date.now();
                startTimer();
                updateStatus('active');
                if (recognition) recognition.start();
                processAudio();
                elements.transcript.innerHTML = '<span class="orbitron text-xs animate-pulse text-cyan-500/50">Flux neural prêt, en attente de signal...</span>';
            } else {
                state.isListening = false;
                stopTimer();
                updateStatus('ready');
                if (recognition) recognition.stop();
                elements.transcript.innerHTML = '<div class="h-full flex items-center justify-center opacity-20 italic orbitron text-sm tracking-widest">Écoute en pause...</div>';
            }
        });

        elements.copyBtn.addEventListener('click', () => {
            const text = state.history.map(h => h.text).join('\n');
            navigator.clipboard.writeText(text).then(() => showToast("Flux copié !"));
        });

        elements.exportBtn.addEventListener('click', () => {
            const text = state.history.map(h => `[${h.time}] ${h.text}`).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orateur-ultra-${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        });

        document.getElementById('clearHistory').addEventListener('click', () => {
            if (confirm('Voulez-vous effacer tous les registres ?')) {
                state.history = [];
                localStorage.setItem('orateur_ultra_history', '[]');
                renderHistory();
            }
        });

        // Init history on load
        renderHistory();

        function updateStatus(type) {
            if (type === 'active') {
                elements.statusDot.classList.replace('bg-gray-500', 'bg-red-500');
                elements.statusText.innerText = "ÉCOUTE ACTIVE";
                elements.statusText.classList.replace('text-gray-400', 'text-red-500');
                elements.toggleText.innerText = "ARRÊTER L'ÉCOUTE";
                elements.toggleIcon.classList.replace('fa-play', 'fa-stop');
                elements.toggleIcon.classList.add('text-red-500');
            } else {
                elements.statusDot.classList.replace('bg-red-500', 'bg-gray-500');
                elements.statusText.innerText = "PRÊT";
                elements.statusText.classList.replace('text-red-500', 'text-gray-400');
                elements.toggleText.innerText = "INITIALISER L'ÉCOUTE";
                elements.toggleIcon.classList.replace('fa-stop', 'fa-play');
                elements.toggleIcon.classList.remove('text-red-500');
            }
        }

        function startTimer() {
            state.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                elements.timer.innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
        }
    </script>
</body>
</html>
