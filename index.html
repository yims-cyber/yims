<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orateur Ultra - Console de Transcription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --neon-cyan: #00f2ff;
            --neon-purple: #bc13fe;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 99;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 242, 255, 0.02) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        @media (max-width: 1024px) {
            body {
                height: auto;
                overflow: auto;
            }
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .glass {
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        .neon-text-cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .neon-text-purple {
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(188, 19, 254, 0.5);
        }

        .neon-border-cyan {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 10px;
        }

        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 242, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
        }

        .pulse-analyse {
            animation: pulse-cyan 2s infinite;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(188, 19, 254, 0.3);
            transform: translateX(4px);
        }

        /* Responsive Grid Adjustments */
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 1024px) {
            .dashboard-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
        }
    </style>
</head>
<body class="relative">
    <div class="scanline"></div>
    <!-- Main UI will be built here -->
    <div id="app" class="flex flex-col h-full w-full relative z-10">
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-6 border-b border-white/5 bg-black/40 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fas fa-satellite-dish text-black text-sm"></i>
                </div>
                <div>
                    <h1 class="orbitron text-sm font-bold tracking-widest neon-text-cyan">ORATEUR ULTRA</h1>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-tighter">Signal Intelligence Node</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <div id="statusIndicator" class="w-2 h-2 rounded-full bg-gray-600"></div>
                    <span id="statusLabel" class="orbitron text-[10px] text-gray-400 font-bold">OFFLINE</span>
                </div>
                <div class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-md border border-white/10">
                    <i class="fas fa-microchip text-[10px] text-purple-400"></i>
                    <span id="timer" class="orbitron text-[11px] font-bold">00:00:00</span>
                </div>
            </div>
        </header>

        <!-- Body Grid -->
        <div class="dashboard-container">
            <!-- Audio Analysis Column -->
            <div class="lg:col-span-4 flex flex-col gap-6 min-h-0">
                <!-- Visualizer & DB -->
                <div class="glass p-5 flex flex-col gap-4 relative overflow-hidden group">
                    <div class="absolute -right-4 -top-4 w-24 h-24 bg-cyan-500/5 rounded-full blur-3xl group-hover:bg-cyan-500/10 transition-all"></div>
                    <div class="flex justify-between items-end">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-wave-square text-[10px] text-cyan-500/50"></i>
                            <span class="orbitron text-[10px] text-gray-500 font-bold uppercase tracking-widest">Spectre Vocal</span>
                        </div>
                        <span id="dbValue" class="orbitron text-xs font-bold text-cyan-400">-∞ dB</span>
                    </div>
                    <div class="h-1 bg-black/50 rounded-full overflow-hidden border border-white/5">
                        <div id="dbMeter" class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 transition-all duration-75" style="width: 0%"></div>
                    </div>
                    <canvas id="visualizer" class="w-full h-24 rounded-lg bg-black/40"></canvas>
                </div>

                <!-- Metrics Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass p-4 border-l-2 border-l-cyan-500">
                        <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Qualité du Son</p>
                        <p id="metricQuality" class="orbitron text-sm font-bold text-gray-400">---</p>
                    </div>
                    <div class="glass p-4 border-l-2 border-l-purple-500">
                        <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Bruit / SNR</p>
                        <p id="metricSNR" class="orbitron text-sm font-bold text-gray-400">---</p>
                    </div>
                    <div class="glass p-4 border-l-2 border-l-indigo-500">
                        <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Voix Secondaires</p>
                        <p id="metricSecondary" class="orbitron text-sm font-bold text-gray-400">---</p>
                    </div>
                    <div class="glass p-4 border-l-2 border-l-emerald-500">
                        <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Stabilité Signal</p>
                        <p id="metricStability" class="orbitron text-sm font-bold text-gray-400">---</p>
                    </div>
                </div>

                <!-- Controls -->
                <div class="mt-auto pb-4">
                    <button id="toggleBtn" class="w-full py-4 rounded-xl border border-cyan-500/30 bg-cyan-500/10 hover:bg-cyan-500/20 transition-all flex items-center justify-center gap-3 group">
                        <div id="toggleIcon" class="w-8 h-8 rounded-full bg-cyan-500 flex items-center justify-center text-black shadow-[0_0_15px_rgba(0,242,255,0.4)]">
                            <i class="fas fa-play text-xs"></i>
                        </div>
                        <span id="toggleText" class="orbitron font-bold tracking-[0.2em] text-cyan-400 group-hover:text-cyan-300">INITIALISER</span>
                    </button>
                </div>
            </div>

            <!-- Transcription Column -->
            <div class="lg:col-span-8 flex flex-col gap-6 min-h-0">
                <!-- Live Text -->
                <div class="glass p-8 relative flex-shrink-0">
                    <div class="absolute top-4 left-4 flex items-center gap-2">
                        <div id="analyseIndicator" class="hidden w-2 h-2 rounded-full bg-cyan-400 pulse-analyse"></div>
                        <span class="orbitron text-[9px] text-cyan-400/60 font-bold tracking-widest uppercase">Flux Temps Réel</span>
                    </div>
                    <div id="liveText" class="text-3xl font-light leading-relaxed min-h-[4em] text-white/90">
                        <span class="text-white/20 italic text-xl">En attente d'initialisation du signal...</span>
                    </div>
                </div>

                <!-- History -->
                <div class="flex-1 flex flex-col min-h-0">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h3 class="orbitron text-[10px] text-gray-500 font-bold uppercase tracking-widest">Logs de Transcription</h3>
                        <button id="clearBtn" class="text-[10px] text-red-400/50 hover:text-red-400 font-bold uppercase tracking-tighter transition-colors">Vider Cache</button>
                    </div>
                    <div id="historyList" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2">
                        <!-- History items go here -->
                        <div class="text-center py-10 text-white/5 italic">Aucun log enregistré</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION & STATE ---
        const state = {
            isListening: false,
            isSpeaking: false,
            startTime: null,
            timerInterval: null,
            audioMetrics: {
                db: -100,
                noiseFloor: -70,
                snr: 0,
                quality: 0,
                stability: 0,
                secondaryEnergy: 0
            },
            history: JSON.parse(localStorage.getItem('orateur_history') || '[]')
        };

        const elements = {
            toggleBtn: document.getElementById('toggleBtn'),
            toggleIcon: document.getElementById('toggleIcon'),
            toggleText: document.getElementById('toggleText'),
            liveText: document.getElementById('liveText'),
            historyList: document.getElementById('historyList'),
            timer: document.getElementById('timer'),
            dbValue: document.getElementById('dbValue'),
            dbMeter: document.getElementById('dbMeter'),
            visualizer: document.getElementById('visualizer'),
            statusIndicator: document.getElementById('statusIndicator'),
            statusLabel: document.getElementById('statusLabel'),
            analyseIndicator: document.getElementById('analyseIndicator'),
            metricQuality: document.getElementById('metricQuality'),
            metricSNR: document.getElementById('metricSNR'),
            metricSecondary: document.getElementById('metricSecondary'),
            metricStability: document.getElementById('metricStability'),
            clearBtn: document.getElementById('clearBtn')
        };

        // --- AUDIO ENGINE ---
        let audioContext, analyser, source, stream;
        const VAD_THRESHOLD = -45;

        async function initAudio() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // Adjust visualizer size
                const resize = () => {
                    elements.visualizer.width = elements.visualizer.clientWidth;
                    elements.visualizer.height = elements.visualizer.clientHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                function render() {
                    if (!state.isListening) return;
                    requestAnimationFrame(render);

                    analyser.getByteFrequencyData(dataArray);

                    // 1. Calculate RMS and dB
                    let sum = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i] * dataArray[i];
                    }
                    let rms = Math.sqrt(sum / bufferLength);
                    let db = 20 * Math.log10(rms / 255);
                    if (isNaN(db) || db === -Infinity) db = -100;

                    state.audioMetrics.db = db;

                    // 2. VAD Logic & Gated Analysis
                    state.isSpeaking = db > VAD_THRESHOLD;

                    if (state.isSpeaking) {
                        elements.analyseIndicator.classList.remove('hidden');
                        performGatedAnalysis(dataArray, db);
                    } else {
                        elements.analyseIndicator.classList.add('hidden');
                        // Track noise floor during silence
                        state.audioMetrics.noiseFloor = (state.audioMetrics.noiseFloor * 0.95) + (db * 0.05);
                    }

                    updateAudioUI(db);
                    drawVisualizer(dataArray);
                }

                render();
            } catch (err) {
                console.error("Audio Engine Init Failed:", err);
            }
        }

        function performGatedAnalysis(dataArray, currentDb) {
            const nyquist = audioContext.sampleRate / 2;
            const binSize = nyquist / dataArray.length;

            let vocalEnergy = 0;
            let nonVocalEnergy = 0;

            // Vocal range approximation: 300Hz - 3000Hz
            for(let i = 0; i < dataArray.length; i++) {
                const freq = i * binSize;
                if (freq >= 300 && freq <= 3000) {
                    vocalEnergy += dataArray[i];
                } else {
                    nonVocalEnergy += dataArray[i];
                }
            }

            // 1. Secondary Voices / Noise outside vocal range
            const ratio = nonVocalEnergy / (vocalEnergy || 1);
            state.audioMetrics.secondaryEnergy = ratio;

            // 2. SNR
            const snr = currentDb - state.audioMetrics.noiseFloor;
            state.audioMetrics.snr = snr;

            // 3. Quality & Stability (simplified heuristic)
            let quality = "Optimale";
            let qualityColor = "text-emerald-400";

            if (snr < 15) {
                quality = "Faible";
                qualityColor = "text-red-400";
            } else if (snr < 25) {
                quality = "Moyenne";
                qualityColor = "text-yellow-400";
            }

            // Update Metrics UI
            elements.metricSNR.innerText = `${snr.toFixed(1)} dB`;
            elements.metricSNR.className = `orbitron text-sm font-bold ${snr > 20 ? 'text-emerald-400' : 'text-yellow-400'}`;

            elements.metricQuality.innerText = quality;
            elements.metricQuality.className = `orbitron text-sm font-bold ${qualityColor}`;

            const secondaryPercent = Math.min(100, (ratio * 100)).toFixed(0);
            elements.metricSecondary.innerText = `${secondaryPercent}%`;
            elements.metricSecondary.className = `orbitron text-sm font-bold ${secondaryPercent < 30 ? 'text-emerald-400' : 'text-red-400'}`;

            const stability = Math.max(0, 100 - (ratio * 50)).toFixed(0);
            elements.metricStability.innerText = `${stability}%`;
            elements.metricStability.className = `orbitron text-sm font-bold text-emerald-400`;
        }

        function updateAudioUI(db) {
            elements.dbValue.innerText = `${db === -100 ? '-∞' : db.toFixed(1)} dB`;
            let percentage = Math.max(0, (db + 70) * 1.4);
            elements.dbMeter.style.width = `${percentage}%`;

            if (db > -5) {
                elements.dbMeter.classList.add('bg-red-500');
            } else {
                elements.dbMeter.classList.remove('bg-red-500');
            }
        }

        function drawVisualizer(dataArray) {
            const canvas = elements.visualizer;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);
            const barWidth = (w / dataArray.length) * 2;
            let x = 0;

            for(let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * h;
                const gradient = ctx.createLinearGradient(0, h, 0, h - barHeight);
                gradient.addColorStop(0, '#bc13fe');
                gradient.addColorStop(1, '#00f2ff');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, h - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        // --- SPEECH RECOGNITION ---
        let recognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onstart = () => updateStatusUI('active');
            recognition.onend = () => state.isListening ? recognition.start() : updateStatusUI('offline');

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        processFinalPhrase(event.results[i][0].transcript.trim());
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                if (interimTranscript) {
                    elements.liveText.innerHTML = `<span class="text-cyan-400/80">${interimTranscript}</span>`;
                }
            };
        }

        function processFinalPhrase(phrase) {
            if (!phrase) return;
            phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);

            const item = {
                id: Date.now(),
                text: phrase,
                time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };

            state.history.unshift(item);
            if (state.history.length > 50) state.history.pop();
            localStorage.setItem('orateur_history', JSON.stringify(state.history));
            renderHistory();

            elements.liveText.innerHTML = `<span class="text-white">${phrase}</span>`;

            // Server Broadcast (post.php integration)
            fetch('post.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `msg=${encodeURIComponent(phrase)}&post=yes`
            }).catch(() => {});
        }

        // --- CONTROLS & UI UPDATES ---
        function updateStatusUI(type) {
            if (type === 'active') {
                elements.statusIndicator.className = "w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f2ff]";
                elements.statusLabel.innerText = "SIGNAL ACTIVE";
                elements.statusLabel.className = "orbitron text-[10px] text-cyan-400 font-bold";
            } else {
                elements.statusIndicator.className = "w-2 h-2 rounded-full bg-gray-600";
                elements.statusLabel.innerText = "OFFLINE";
                elements.statusLabel.className = "orbitron text-[10px] text-gray-400 font-bold";
            }
        }

        elements.toggleBtn.addEventListener('click', async () => {
            if (!state.isListening) {
                state.isListening = true;
                state.startTime = Date.now();

                state.timerInterval = setInterval(() => {
                    const diff = Date.now() - state.startTime;
                    const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                    const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    elements.timer.innerText = `${h}:${m}:${s}`;
                }, 1000);

                elements.toggleText.innerText = "INTERROMPRE";
                elements.toggleIcon.innerHTML = '<i class="fas fa-stop text-xs"></i>';
                elements.toggleIcon.className = "w-8 h-8 rounded-full bg-red-500 flex items-center justify-center text-black shadow-[0_0_15px_rgba(239,68,68,0.4)]";
                elements.toggleBtn.className = "w-full py-4 rounded-xl border border-red-500/30 bg-red-500/10 hover:bg-red-500/20 transition-all flex items-center justify-center gap-3 group";

                if (!audioContext) await initAudio();
                if (recognition) recognition.start();
                elements.liveText.innerHTML = '<span class="text-cyan-400 animate-pulse">Synchronisation du flux vocal...</span>';
            } else {
                state.isListening = false;
                clearInterval(state.timerInterval);

                elements.toggleText.innerText = "INITIALISER";
                elements.toggleIcon.innerHTML = '<i class="fas fa-play text-xs"></i>';
                elements.toggleIcon.className = "w-8 h-8 rounded-full bg-cyan-500 flex items-center justify-center text-black shadow-[0_0_15px_rgba(0,242,255,0.4)]";
                elements.toggleBtn.className = "w-full py-4 rounded-xl border border-cyan-500/30 bg-cyan-500/10 hover:bg-cyan-500/20 transition-all flex items-center justify-center gap-3 group";

                if (recognition) recognition.stop();
                elements.liveText.innerHTML = '<span class="text-white/20 italic text-xl">Signal interrompu</span>';
                elements.analyseIndicator.classList.add('hidden');
            }
        });

        function renderHistory() {
            if (state.history.length === 0) {
                elements.historyList.innerHTML = '<div class="text-center py-10 text-white/5 italic">Aucun log enregistré</div>';
                return;
            }
            elements.historyList.innerHTML = state.history.map(item => `
                <div class="history-item p-3 flex gap-3 items-start">
                    <span class="orbitron text-[9px] text-purple-400/50 mt-0.5">${item.time}</span>
                    <p class="text-[13px] text-white/70 leading-relaxed flex-1">${item.text}</p>
                </div>
            `).join('');
        }

        elements.clearBtn.addEventListener('click', () => {
            if (confirm('Vider l\'historique ?')) {
                state.history = [];
                localStorage.setItem('orateur_history', '[]');
                renderHistory();
            }
        });

        // Initialize history on load
        renderHistory();
    </script>
</body>
</html>
